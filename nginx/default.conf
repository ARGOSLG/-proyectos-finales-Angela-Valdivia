server {
    listen 80;
    server_name localhost;

    # ─────────────────────────────────────────
    # Raíz del proyecto — apunta a /public de Laravel
    # IMPORTANTE: nunca apuntes a /var/www directamente
    # ─────────────────────────────────────────
    root /var/www/public;
    index index.php;

    # ─────────────────────────────────────────
    # Tamaño máximo para uploads (videos de evidencia)
    # ─────────────────────────────────────────
    client_max_body_size 100M;

    # ─────────────────────────────────────────
    # Enrutamiento principal de Laravel
    # Primero busca el archivo real, si no existe
    # pasa todo a index.php (el router de Laravel)
    # ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─────────────────────────────────────────
    # Pasar archivos .php a PHP-FPM
    # ─────────────────────────────────────────
    location ~ \.php$ {
        # Opción A (Docker Compose): Apunta al servicio/contenedor 'app' en el puerto 9000
        fastcgi_pass app:9000;

        # Opción B (Mismo servidor/Railway monolithic): Descomenta si usas socket Unix
        # fastcgi_pass unix:/var/run/php/php-fpm.sock;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout más largo para operaciones pesadas (procesar video)
        fastcgi_read_timeout 300;
    }

    # ─────────────────────────────────────────
    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    # ─────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ─────────────────────────────────────────
    # Logs (visibles con: docker logs argos_nginx)
    # ─────────────────────────────────────────
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}